<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07080b">
  <title>Ares</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">

    <header class="top">
      <div class="brand">
        <span class="dot" id="status-dot"></span>
        <span class="name">ARES</span>
        <span class="ver">v0.2</span>
      </div>
      <div class="top-actions">
        <span class="status-text" id="status-text">En espera</span>
        <button class="icon-btn" id="btn-settings" aria-label="Ajustes">⚙</button>
      </div>
    </header>

    <section class="stage" aria-hidden="true">
      <canvas id="orb" width="600" height="600"></canvas>
    </section>

    <main class="log" id="log" aria-live="polite"></main>

    <footer class="bar">
      <div class="chips" id="chips"></div>
      <form class="input-row" id="form" autocomplete="off">
        <button type="button" class="mic" id="btn-mic" aria-label="Hablar con Ares">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V22h2v-3.08A7 7 0 0 0 19 12h-2Z"/></svg>
        </button>
        <input type="text" id="input" placeholder="Escribe o di “Ares…”" enterkeyhint="send">
        <button type="submit" class="send" aria-label="Enviar">➤</button>
      </form>
    </footer>
  </div>

  <dialog id="settings">
    <form method="dialog" class="settings-card" id="settings-form">
      <h2>Ajustes de Ares</h2>

      <label>Tu nombre
        <input type="text" id="set-name" placeholder="Cómo quieres que te llame">
      </label>

      <label>Dirección del cerebro (proxy)
        <input type="url" id="set-proxy" placeholder="https://ares-proxy.tuusuario.workers.dev">
        <small>Sin esto, Ares solo usa sus herramientas locales. Mira el README.</small>
      </label>

      <label class="check"><input type="checkbox" id="set-voice"> Respuestas en voz alta</label>
      <label class="check"><input type="checkbox" id="set-wake"> Siempre escuchando (di “Ares, …”)</label>

      <div class="settings-actions">
        <button type="button" class="ghost" id="btn-forget">Borrar memoria</button>
        <button type="submit" class="primary" value="ok">Guardar</button>
      </div>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
