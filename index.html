<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>ARES</title>
  <meta name="description" content="ARES - Asistente de IA personal" />
  <meta name="theme-color" content="#050b14" />

  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <!-- Pantalla de bloqueo (se activa en la parte de seguridad) -->
  <section id="lock-screen" class="lock" hidden>
    <div class="lock-card">
      <div class="reactor reactor--big" aria-hidden="true"><span></span></div>
      <h2>ARES</h2>
      <p class="muted">Acceso restringido. Identifícate.</p>
      <input id="lock-input" type="password" placeholder="Contraseña maestra" autocomplete="current-password" />
      <button id="lock-btn" class="btn btn--primary" type="button">Desbloquear</button>
      <p id="lock-error" class="error" hidden></p>
    </div>
  </section>

  <!-- Aplicación principal -->
  <div id="app" class="app">

    <header class="topbar">
      <div class="brand">
        <div class="reactor" aria-hidden="true"><span></span></div>
        <div class="brand-text">
          <h1>ARES</h1>
          <p id="status-text" class="status">En línea</p>
        </div>
      </div>

      <div class="top-actions">
        <button id="btn-new" class="icon-btn" type="button" title="Nueva conversación" aria-label="Nueva conversación">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        </button>
        <button id="btn-settings" class="icon-btn" type="button" title="Ajustes" aria-label="Ajustes">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
        </button>
      </div>
    </header>

    <!-- Zona de mensajes -->
    <main id="chat" class="chat" aria-live="polite">
      <section id="welcome" class="welcome">
        <div class="reactor reactor--big" aria-hidden="true"><span></span></div>
        <h2>Sistemas en línea.</h2>
        <p class="muted">Soy ARES. ¿En qué trabajamos hoy?</p>
        <div class="chips">
          <button class="chip" type="button" data-prompt="Explícame qué es una inyección SQL y cómo defenderme.">Seguridad: inyección SQL</button>
          <button class="chip" type="button" data-prompt="Revisa este código y dime qué vulnerabilidades tiene.">Revisar código</button>
          <button class="chip" type="button" data-prompt="Ayúdame a planear un proyecto web paso a paso.">Planear un proyecto</button>
        </div>
      </section>
    </main>

    <!-- Barra de escritura -->
    <footer class="composer">
      <button id="btn-mic" class="icon-btn" type="button" title="Hablar" aria-label="Hablar">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v4"/></svg>
      </button>

      <textarea id="input" class="input" rows="1" placeholder="Escribe a ARES..." autocomplete="off" enterkeyhint="send"></textarea>

      <button id="btn-send" class="btn-send" type="button" title="Enviar" aria-label="Enviar">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4z"/></svg>
      </button>
    </footer>
  </div>

  <!-- Panel de ajustes -->
  <div id="drawer-backdrop" class="backdrop" hidden></div>
  <aside id="settings" class="drawer" hidden>
    <div class="drawer-head">
      <h3>Ajustes</h3>
      <button id="btn-close-settings" class="icon-btn" type="button" aria-label="Cerrar">✕</button>
    </div>

    <label class="field">
      <span>Modelo</span>
      <select id="model-select" class="select select--full">
        <option value="auto">Automático (recomendado)</option>
        <option value="potente">Potente (Llama 70B)</option>
        <option value="rapido">Rápido (Llama 8B)</option>
      </select>
    </label>

    <label class="switch">
      <input id="toggle-voice" type="checkbox" />
      <span>Respuestas por voz</span>
    </label>

    <label class="switch">
      <input id="toggle-web" type="checkbox" />
      <span>Acceso a la web</span>
    </label>

    <button id="btn-clear" class="btn btn--danger" type="button">Borrar historial</button>
    <p class="muted small">ARES v0.1</p>
  </aside>

  <div id="toast" class="toast" hidden></div>

  <!-- Un solo script de entrada; él importa los demás -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
