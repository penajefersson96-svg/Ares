# ARES - configuración de Cloudflare Workers

# IMPORTANTE: cambia "ares" por el nombre EXACTO de tu Worker en Cloudflare (Paso 1)
name = "ares-worker"

main = "worker/index.js"
compatibility_date = "2026-01-01"

# Carpeta que se publica como página (index.html, css, js, etc.).
# Lo que NO debe ser público se excluye en el archivo .assetsignore
[assets]
directory = "./"

# Acceso a la IA gratuita de Cloudflare
[ai]
binding = "AI"

# Variables de texto (los secretos NO van aquí)
[vars]
ALLOWED_ORIGINS = "*"